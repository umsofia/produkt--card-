
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    />

    <button id="change=Color=Button">сменить цвет карточки</button>

    <main class="container">
      <div class="container_cards">

        <template class="product-template">

            <img class="card_img" src="" alt="Product Image" />

            <h2 class="card_title"></h2>
            <p class="description"></p>
            <span class="list-structure">Состав</span>
            <ul class="product__items-list">
              <li class="card_item"></li>
              <li class="card_item"></li>
              <li class="card_item"></li>
            </ul>
            
            <div class="card_price-row">
              <b class="card_price-text">Цена</b>
              <span class="card_price"></span>
