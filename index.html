
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Документ продуктов магазина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <main class="container">
      <div class="container_cards">
        
        <!-- Контент теперь находится СТРОГО внутри тега template -->
        <template id="product-template">
          <div class="product-card">
            <img class="product_card_img" src="" alt="" />
            <span class="product_skin-type"></span>
            <h2 class="product_card_title"></h2>
            <p class="product_description"></p>
            <span class="product_list-structure"></span>
            
            <ul class="product__items-list">
              <li class="card_item"></li>
              <li class="card_item"></li>
              <li class="card_item"></li>
            </ul>
            
            <div class="card_price-row">
              <b class="card_price-text"></b>
              <span class="card_price"></span>
            </div>
          </div>
        </template>

      </div>
    
    <script type="module" src="./homework-10.js"></script>
  </body>
</html>
