
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Документ продуктов магазина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" >
  </head>
  <body>
    
    <button id="change=Color=Button">сменить цвет карточки</button>
   
    <h1 class="title">Выбери свой продукт</h1>  
    <main class="container">
     <!-- div class="container_cards">-->
        
   <ul class="product-list">
        <template class="product-template">
          <li class="card">
            <img class="img__class" src="" alt="Product Image" />
            <span class="card__skin-type">для номальой кожи</span>
            <h2 class="card__title"></h2>
            <p class="description"></p>
            <span class="list-structure">Состав</span>
            <ul class="product__items-list">
              <li class="card_item"></li>
              <li class="card_item"></li>
              <li class="card_item"></li>
            </ul>
            
            <div class="card__price-row">
              <b class="card__price-text">Цена</b>
              <span class="card__price"></span>
            </div>
          </li>
         </template>
         
      </div>
      
    
    <script type="module" src="./homework-10.js"></script>
  </body>
</html>
